id = "est7.amq-adapter"
name = "AMQ Adapter"
version = "0.3.3"
min_herdr_version = "0.9.1"
description = "Agents in Herdr panes message each other over AMQ with zero config: auto-named handles, one shared root, delivery via `herdr agent prompt`."
platforms = ["linux", "macos"]

# Downloads the release binary for this machine (verified against the
# release's SHA256SUMS) and installs amq and amq-bridge when missing;
# a development checkout with Go builds from source instead.
[[build]]
command = ["sh", "scripts/install.sh"]

# Startup: reconcile waker inventory against live named agents.
[[startup]]
command = ["bin/herdr-amq-adapter", "reconcile"]

[[events]]
on = "pane.agent_detected"
command = ["bin/herdr-amq-adapter", "hook"]

[[events]]
on = "pane.closed"
command = ["bin/herdr-amq-adapter", "hook"]

[[events]]
on = "pane.exited"
command = ["bin/herdr-amq-adapter", "hook"]

[[events]]
on = "pane.moved"
command = ["bin/herdr-amq-adapter", "hook"]

[[actions]]
id = "configure"
title = "AMQ: set up (link the command and skill, adopt open agents)"
command = ["bin/herdr-amq-adapter", "configure"]

[[actions]]
id = "reconcile"
title = "AMQ: reconcile wakers"
command = ["bin/herdr-amq-adapter", "reconcile"]

[[actions]]
id = "status"
title = "AMQ: waker status"
command = ["bin/herdr-amq-adapter", "status"]

[[actions]]
id = "bridge-status"
title = "AMQ: cross-machine bridge status"
command = ["bin/herdr-amq-adapter", "bridge", "status"]

[[actions]]
id = "bridge-ensure"
title = "AMQ: start or reload the cross-machine bridge"
command = ["bin/herdr-amq-adapter", "bridge", "ensure"]

[[panes]]
id = "status"
title = "AMQ 通信状态"
placement = "popup"
width = "90%"
height = "80%"
command = ["bin/herdr-amq-adapter", "status-popup"]

[[actions]]
id = "dashboard"
title = "AMQ: 通信状态"
command = ["bin/herdr-amq-adapter", "dashboard"]
